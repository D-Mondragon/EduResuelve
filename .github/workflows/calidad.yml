# Control de calidad automático (Fase 8 — plan de control de calidad)
# Se ejecuta en cada push y pull request a main. Si una verificación falla, el commit queda marcado en rojo.
name: Control de calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  estatico-y-unitario:
    name: Lint, tipos, build y pruebas (SQL + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Análisis estático (ESLint)
        run: npm run lint
      - name: Compilación (TypeScript + Vite)
        run: npm run build
      - name: Pruebas de reglas de negocio (SQL sobre PGlite)
        run: npm run test:sql
      - name: Pruebas de interfaz con cobertura
        run: npm run test:coverage
      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Cobertura de pruebas (frontend)", "| Métrica | % | Cubiertos |", "|---|---|---|",
                row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: frontend/coverage
          retention-days: 30

  e2e:
    name: Pruebas end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: estatico-y-unitario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E (escritorio y móvil)
        run: npm run test:e2e
      - name: Guardar informe de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: frontend/playwright-report
          retention-days: 30
